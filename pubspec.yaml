name: etohost_mesh
description: Etohost Mesh — кроссплатформенный клиент для нод Meshtastic (BLE / TCP / USB) с опциональным зеркалом.
publish_to: none
version: 0.1.1+1

environment:
  sdk: ^3.9.0

dependencies:
  cryptography: ^2.9.0
  cupertino_icons: ^2.0.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  emoji_picker_flutter: ^4.5.4
  file_picker: ^13.1.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_libserialport: ^0.6.0
  flutter_local_notifications: ^22.3.2
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  go_router: ^18.1.0
  http: ^1.6.0
  latlong2: ^0.9.1
  mobile_scanner: ^7.4.2
  mqtt_client: ^10.13.0
  nsd: ^5.0.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  protobuf: ^6.1.0
  qr_flutter: ^4.1.0
  swipeable_page_route: ^0.4.8
  toastification: ^3.2.0
  tray_manager: ^0.5.2
  typed_data: ^1.4.0
  universal_ble: ^3.1.1
  url_launcher: ^6.3.3
  usb_serial: ^0.5.2
  webview_flutter: ^4.14.1
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/icon/window.png

# Иконки приложения: CI запускает `dart run flutter_launcher_icons` после
# flutter create. Исходники — assets/icon/src/*.svg; PNG делает
# tool/make_icons.py.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  # Сплошной фон (BG в tool/make_icons.py), рисунок — в переднем слое.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/android_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
  windows:
    generate: true
    icon_size: 256
