name: publish

# Выкладка опубликованного релиза на https://etohost.ru/downloads.
# Срабатывает, когда черновик релиза публикуют на GitHub, — сайт не обгоняет
# страницу релиза. Вручную: Actions → publish → Run workflow, указать тег.
#
# Файлы качает сам сервер (tools/fetch_release.py, на g4 — /usr/local/bin/etohost-fetch-release): с GitHub это в
# разы быстрее, чем заливать их отсюда через туннель. Здесь только вызов:
# туннель WireGuard (секрет WG_CONFIG, пир GitHubReleases — роутер пускает
# его только на SSH g4) и ключ DEPLOY_SSH_KEY пользователя releases, который
# может лишь запустить этот скрипт с тегом.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег опубликованного релиза (v0.1.11)'
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

env:
  HOST: 192.168.1.10
  # Ключ сервера g4 (публичный) — без ssh-keyscan через туннель.
  HOST_KEY: '192.168.1.10 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB8JscRbXbYlW7gVny1cwydVZDgCl9dzcHaElTir+ih/'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Не тег версии: $TAG"; exit 1 ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: WireGuard
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          sudo apt-get install -y -qq wireguard-tools >/dev/null
          printf '%s\n' "$WG_CONFIG" | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$HOST_KEY" > ~/.ssh/known_hosts

      # Сервер качает файлы релиза, проверяет sha256, ставит их и
      # release.json последним, чистит старые версии; печатает release.json.
      - name: Publish on server
        run: ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "releases@$HOST" "$TAG"

      - name: Down
        if: always()
        run: |
          sudo wg-quick down wg0 || true
          rm -f ~/.ssh/deploy_key
