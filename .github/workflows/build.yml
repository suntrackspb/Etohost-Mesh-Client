name: build

# Сборка: по тегу v* (релиз) и вручную (Actions → build → Run workflow).
# На каждый пуш в main не собираем — прогоны копились в очереди.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Создать draft release'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            cmd: flutter build apk --release
            out: build/app/outputs/flutter-apk/app-release.apk
          - platform: linux
            os: ubuntu-latest
            cmd: flutter build linux --release
            out: build/linux/x64/release/bundle
          - platform: windows
            os: windows-latest
            cmd: flutter build windows --release
            out: build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            cmd: flutter build macos --release
            out: build/macos/Build/Products/Release/*.app
          - platform: ios
            os: macos-latest
            cmd: flutter build ios --release --no-codesign
            out: build/ios/iphoneos/Runner.app
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev libnotify-dev libayatana-appindicator3-dev

      # libserialport (USB Serial) собирается из исходников через autotools.
      - name: Install autotools (macOS)
        if: matrix.platform == 'macos'
        run: brew install automake libtool

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folder
        shell: bash
        run: |
          flutter create . --platforms=${{ matrix.platform }} \
            --project-name etohost_mesh --org ru.etohost
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py || python tool/patch_platforms.py
          if [ -f flutter_launcher_icons.yaml ]; then dart run flutter_launcher_icons; fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      # Сборка по тегу v1.2.3 — версия приложения из тега (по ней проверка обновлений).
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION_ARGS=--build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}" >> "$GITHUB_ENV"
      # Сервис картинок: переменные репозитория IMAGES_URL и IMAGES_KEY
      # (не секреты — адрес и публичный ключ). Пусто — кнопки «Картинка» нет.
      # CARTO_KEY — тёмная подложка карты; пусто — только OSM.
      # Отчёты: переменная REPORT_URL и секрет REPORT_KEY; пусто — отправки нет.
      - run: |
          ${{ matrix.cmd }} $VERSION_ARGS \
            --dart-define=REPORT_URL="${{ vars.REPORT_URL }}" \
            --dart-define=REPORT_KEY="${{ secrets.REPORT_KEY }}" \
            --dart-define=IMAGES_URL="${{ vars.IMAGES_URL }}" \
            --dart-define=IMAGES_KEY="${{ vars.IMAGES_KEY }}" \
            --dart-define=CARTO_KEY="${{ vars.CARTO_KEY }}"
        shell: bash

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          name=etohost-mesh-${{ matrix.platform }}
          case "${{ matrix.platform }}" in
            android) cp ${{ matrix.out }} dist/$name.apk ;;
            ios)
              # Неподписанный .ipa — Sideloadly подпишет своим Apple ID.
              mkdir -p Payload && cp -R ${{ matrix.out }} Payload/
              zip -qry dist/$name.ipa Payload ;;
            macos) (cd "$(dirname ${{ matrix.out }})" && zip -qry "$GITHUB_WORKSPACE/dist/$name.zip" *.app) ;;
            windows) pwsh -c "Compress-Archive -Path '${{ matrix.out }}/*' -DestinationPath dist/$name.zip" ;;
            linux) tar -czf dist/$name.tar.gz -C ${{ matrix.out }} . ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: etohost-mesh-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('prototype-{0}', github.run_number) }}
          name: Etohost Mesh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('#{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
