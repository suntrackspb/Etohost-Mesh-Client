name: build

# Сборка: по тегу v* (релиз) и вручную (Actions → build → Run workflow).
# На каждый пуш в main не собираем — прогоны копились в очереди.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Создать draft release'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            cmd: flutter build apk --release
            out: build/app/outputs/flutter-apk/app-release.apk
          # Старый glibc: собранное на ubuntu-latest (glibc 2.42) не
          # грузится на Ubuntu 24.04 (2.39) — libserialport.so не открывается.
          - platform: linux
            os: ubuntu-22.04
            cmd: flutter build linux --release
            out: build/linux/x64/release/bundle
          - platform: windows
            os: windows-latest
            cmd: flutter build windows --release
            out: build/windows/x64/runner/Release
          - platform: macos
            os: macos-latest
            cmd: flutter build macos --release
            out: build/macos/Build/Products/Release/*.app
          - platform: ios
            os: macos-latest
            cmd: flutter build ios --release --no-codesign
            out: build/ios/iphoneos/Runner.app
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libsecret-1-dev libnotify-dev libayatana-appindicator3-dev

      # libserialport (USB Serial) собирается из исходников через autotools.
      - name: Install autotools (macOS)
        if: matrix.platform == 'macos'
        run: brew install automake libtool

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Подпись APK постоянным ключом: секреты ANDROID_KEYSTORE_BASE64 (jks в
      # base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS. Без ключа
      # каждая сборка подписана своим отладочным и не ставится поверх
      # прежней — поэтому релиз (тег) без ключа не собираем.
      - name: Android signing key
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::нет секрета ANDROID_KEYSTORE_BASE64 — релизный APK не подписать"
              exit 1
            fi
            echo "::warning::нет ключа — APK с отладочной подписью"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Generate platform folder
        shell: bash
        run: |
          flutter create . --platforms=${{ matrix.platform }} \
            --project-name etohost_mesh --org ru.etohost
          rm -f test/widget_test.dart
          python3 tool/patch_platforms.py || python tool/patch_platforms.py
          if [ -f flutter_launcher_icons.yaml ]; then dart run flutter_launcher_icons; fi

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      # Сборка по тегу v1.2.3 — версия приложения из тега (по ней проверка обновлений).
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION_ARGS=--build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}" >> "$GITHUB_ENV"
      # Сервис картинок: переменные репозитория IMAGES_URL и IMAGES_KEY
      # (не секреты — адрес и публичный ключ). Пусто — кнопки «Картинка» нет.
      # CARTO_KEY — тёмная подложка карты; пусто — только OSM.
      # Отчёты: переменная REPORT_URL и секрет REPORT_KEY; пусто — отправки нет.
      - name: Build
        shell: bash
        env:
          REPORT_URL: ${{ vars.REPORT_URL }}
          REPORT_KEY: ${{ secrets.REPORT_KEY }}
          IMAGES_URL: ${{ vars.IMAGES_URL }}
          IMAGES_KEY: ${{ vars.IMAGES_KEY }}
          CARTO_KEY: ${{ vars.CARTO_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          defines=(
            --dart-define=REPORT_URL="$REPORT_URL"
            --dart-define=REPORT_KEY="$REPORT_KEY"
            --dart-define=IMAGES_URL="$IMAGES_URL"
            --dart-define=IMAGES_KEY="$IMAGES_KEY"
            --dart-define=CARTO_KEY="$CARTO_KEY"
          )
          ${{ matrix.cmd }} $VERSION_ARGS "${defines[@]}"
          # Android: основной APK только arm64 (~30 МБ), универсальный — для x86
          # (эмуляторы, хромбуки). Сборки пишут в один файл — универсальный убираем.
          if [ "${{ matrix.platform }}" = android ]; then
            mkdir -p dist
            cp ${{ matrix.out }} dist/etohost-mesh-android-universal.apk
            ${{ matrix.cmd }} --target-platform android-arm64 $VERSION_ARGS "${defines[@]}"
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          name=etohost-mesh-${{ matrix.platform }}
          case "${{ matrix.platform }}" in
            android) cp ${{ matrix.out }} dist/$name.apk ;;
            ios)
              # Неподписанный .ipa — Sideloadly подпишет своим Apple ID.
              mkdir -p Payload && cp -R ${{ matrix.out }} Payload/
              zip -qry dist/$name.ipa Payload ;;
            macos) (cd "$(dirname ${{ matrix.out }})" && zip -qry "$GITHUB_WORKSPACE/dist/$name.zip" *.app) ;;
            windows) pwsh -c "Compress-Archive -Path '${{ matrix.out }}/*' -DestinationPath dist/$name.zip" ;;
            linux) tar -czf dist/$name.tar.gz -C ${{ matrix.out }} . ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: etohost-mesh-${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('prototype-{0}', github.run_number) }}
          name: Etohost Mesh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('#{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: dist/*
